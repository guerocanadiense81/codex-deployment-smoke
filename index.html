<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A minimal deployment verification site for GitHub Pages.">
  <title>Deployment verification</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #e8f0ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(circle at top, #17385f 0, #07111f 58%);
    }
    main {
      width: min(42rem, 100%);
      padding: clamp(2rem, 7vw, 4rem);
      border: 1px solid #315783;
      border-radius: 1.5rem;
      background: rgb(8 24 43 / 88%);
      box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 35%);
    }
    .status {
      display: inline-flex;
      gap: 0.55rem;
      align-items: center;
      color: #9be9b4;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .status::before {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: #47d97d;
      content: "";
      box-shadow: 0 0 1rem #47d97d;
    }
    h1 { margin: 1rem 0; font-size: clamp(2.1rem, 8vw, 4.25rem); line-height: 0.98; }
    p { margin: 0; color: #bfd0e7; font-size: 1.08rem; line-height: 1.7; }
    code { color: #a9d8ff; }
    .proof { margin-top: 1rem; color: #9be9b4; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <span class="status">Ready</span>
    <h1>Deployment verification</h1>
    <p>This dependency-free site confirms that the repository, publishing source, and HTTPS deployment path are working. Its source is plain <code>HTML</code> and requires no build service.</p>
    <p class="proof">Repository change verified through GitHub Pages.</p>
  </main>
</body>
</html>
